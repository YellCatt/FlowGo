<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowGo · 工作流编排</title>
<style>
  :root {
    --bg: #f5f7fb;
    --panel: #ffffff;
    --panel-2: #ffffff;
    --border: #e5e9f2;
    --border-strong: #d6dde9;
    --text: #1f2937;
    --muted: #6b7280;
    --placeholder: #9ca3af;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #eaf1ff;
    --accent-soft-2: #f3f6ff;
    --success: #16a34a;
    --success-soft: #e8f7ee;
    --danger: #dc2626;
    --danger-soft: #fdecec;
    --warn: #d97706;
    --warn-soft: #fdf3e3;
    --code-bg: #f1f4fa;
    --shadow-card: 0 1px 2px rgba(15, 23, 42, .04), 0 1px 1px rgba(15, 23, 42, .03);
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { height: 100%; }
  button, input, select, textarea {
    font-family: inherit; font-size: 13px; color: var(--text);
  }
  input::placeholder, textarea::placeholder { color: var(--placeholder); }
  button { cursor: pointer; }

  /* ---------- 布局 ---------- */
  .layout { display: flex; flex-direction: column; height: 100%; }
  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 0 22px; height: 56px; flex: 0 0 56px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .logo { font-size: 17px; font-weight: 600; letter-spacing: .5px; color: var(--text); }
  .logo span { color: var(--accent); }
  .topbar .spacer { flex: 1; }
  .badge {
    padding: 4px 10px; border-radius: 999px; font-size: 12px;
    background: var(--code-bg); color: var(--muted); border: 1px solid var(--border);
  }
  .badge.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .main { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 280px; flex: 0 0 280px; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .sidebar-head {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-head h3 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .4px; }
  .sidebar-section { padding: 12px 12px 4px; }
  .sidebar-section + .sidebar-section { border-top: 1px solid var(--border); padding-top: 12px; }
  .sidebar-section h4 {
    margin: 0 4px 8px; font-size: 11px; color: var(--muted);
    font-weight: 600; letter-spacing: .6px; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
  }
  .sidebar-section h4 .count {
    margin-left: auto; background: var(--code-bg); color: var(--muted);
    padding: 1px 6px; border-radius: 999px; font-size: 11px; font-weight: 500;
  }
  .wf-list { overflow-y: auto; flex: 1; padding: 4px 8px 8px; }
  .wf-item {
    padding: 9px 11px; border-radius: var(--radius-sm); margin-bottom: 4px;
    cursor: pointer; border: 1px solid transparent; transition: .12s;
    background: transparent;
  }
  .wf-item:hover { background: var(--accent-soft-2); }
  .wf-item.active { background: var(--accent-soft); border-color: #c7d8ff; }
  .wf-item.active .name { color: var(--accent); }
  .wf-item .name { font-weight: 500; display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .wf-item .meta { font-size: 12px; color: var(--muted); margin-top: 3px; padding-left: 14px; }
  .wf-item .meta .grp { color: var(--accent); }
  .wf-item .name .wf-del {
    margin-left: auto; width: 20px; height: 20px; line-height: 18px;
    text-align: center; border-radius: 4px; color: var(--muted); font-size: 14px;
    opacity: 0; transition: .12s; cursor: pointer; user-select: none;
    border: 1px solid transparent;
  }
  .wf-item:hover .name .wf-del { opacity: 1; }
  .wf-item .name .wf-del:hover { background: var(--danger-soft); color: var(--danger); border-color: #f3c6c6; }

  .wf-group + .wf-group { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .wf-group-head {
    padding: 4px 12px; font-size: 11px; font-weight: 600;
    color: var(--muted); letter-spacing: .5px; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
  }
  .wf-group-head .grp-dot { color: var(--accent); }
  .wf-group-head .grp-count {
    margin-left: auto; background: var(--code-bg); color: var(--muted);
    padding: 0 6px; border-radius: 999px; font-size: 10.5px;
  }
  .content { flex: 1; overflow-y: auto; padding: 22px 26px 60px; }

  /* ---------- 控件 ---------- */
  .btn {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border-strong);
    background: #fff; color: var(--text); transition: .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500;
  }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--accent-soft-2); color: var(--text); border-color: transparent; }
  .btn.small { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
    box-shadow: var(--shadow-card);
  }
  .card-title {
    font-size: 13px; font-weight: 600; color: var(--muted);
    letter-spacing: .5px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
    text-transform: uppercase;
  }
  .card-title .spacer { flex: 1; }
  .card-title .actions { display: flex; gap: 6px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  .field input[type=text], .field input[type=number], .field select, .field textarea {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    background: #fff; border: 1px solid var(--border-strong); outline: none;
    color: var(--text); transition: .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
  }
  .field textarea { resize: vertical; min-height: 72px; font-family: Consolas, Menlo, monospace; font-size: 12.5px; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .switch { display: flex; align-items: center; gap: 8px; }
  .switch input { width: auto; }

  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .hint code, code.inline {
    background: var(--code-bg); padding: 1px 6px; border-radius: 4px;
    color: var(--accent); font-size: 12px;
  }

  /* ---------- 节点 ---------- */
  .node {
    background: #fcfdff; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
  }
  .node-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .node-idx {
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; flex: 0 0 22px;
  }
  .node-head .spacer { flex: 1; }
  .type-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
    background: var(--code-bg); color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 500;
  }

  /* ---------- 运行记录 ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; background: #fafbfd; }
  tbody tr:hover { background: var(--accent-soft-2); }
  tbody tr.clickable { cursor: pointer; }
  .status {
    padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500;
    display: inline-block;
  }
  .status.success { background: var(--success-soft); color: var(--success); }
  .status.failed  { background: var(--danger-soft);  color: var(--danger); }
  .status.running { background: var(--warn-soft); color: var(--warn); }
  .status.pending { background: var(--code-bg); color: var(--muted); }

  .log-item { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; background: #fcfdff; }
  .log-head { display: flex; align-items: center; gap: 10px; }
  .log-head .spacer { flex: 1; }
  pre {
    margin: 8px 0 0; padding: 10px; border-radius: 6px; background: #f7f8fc;
    border: 1px solid var(--border); overflow-x: auto;
    font-family: Consolas, Menlo, monospace; font-size: 12px; color: #475569;
    white-space: pre-wrap; word-break: break-all; max-height: 260px; overflow-y: auto;
  }
  .empty { text-align: center; padding: 40px 0; color: var(--muted); }
  .toast {
    position: fixed; right: 20px; bottom: 20px; padding: 10px 16px; border-radius: 8px;
    background: #fff; border: 1px solid var(--border-strong); z-index: 99;
    box-shadow: 0 8px 24px rgba(15, 23, 42, .12);
    font-size: 13px;
  }
  .toast.error { border-color: var(--danger); color: var(--danger); background: #fff5f5; }
  .toast.success { border-color: var(--success); color: var(--success); background: #f4fbf6; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab {
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border-strong);
    background: #fff; color: var(--muted);
  }
  .tab:hover { color: var(--text); border-color: var(--accent); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .kv { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .kv b { color: var(--text); font-weight: 500; }
  .mono { font-family: Consolas, Menlo, monospace; }

  /* ---------- Demo 卡片 ---------- */
  .demo-card {
    background: linear-gradient(180deg, #fafcff 0%, #f5f8ff 100%);
    border: 1px dashed #c7d8ff; border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 18px;
  }
  .demo-card-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 600; color: var(--accent);
    letter-spacing: .4px; margin-bottom: 12px;
  }
  .demo-card-title .tag {
    background: var(--accent); color: #fff; font-size: 11px;
    padding: 2px 8px; border-radius: 4px; letter-spacing: .5px;
  }
  .demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .demo-card-item {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; cursor: pointer; transition: .15s;
    display: flex; flex-direction: column; gap: 6px; text-align: left;
  }
  .demo-card-item:hover {
    border-color: var(--accent); box-shadow: 0 4px 12px rgba(37, 99, 235, .12);
    transform: translateY(-1px);
  }
  .demo-card-item .demo-name { font-weight: 600; color: var(--text); font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
  .demo-card-item .demo-desc { color: var(--muted); font-size: 12px; line-height: 1.55; flex: 1; }
  .demo-card-item .demo-flow { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .demo-card-item .flow-tag {
    font-size: 11px; padding: 2px 7px; border-radius: 4px;
    background: var(--code-bg); color: var(--muted); font-family: Consolas, Menlo, monospace;
  }

  .demo-group + .demo-group { margin-top: 18px; padding-top: 16px; border-top: 1px dashed #d9e3f7; }
  .demo-group-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .demo-group-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .demo-group-desc { font-size: 12px; color: var(--muted); }
  .demo-tip {
    font-size: 11.5px; color: var(--accent); background: var(--accent-soft);
    border-radius: 5px; padding: 5px 8px; line-height: 1.5;
  }

  /* ---------- 编辑 / 运行 标签页 ---------- */
  .content-tabs {
    display: flex; gap: 4px; margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .content-tab {
    padding: 9px 18px; border: none; background: transparent; color: var(--muted);
    font-size: 13px; font-weight: 500; border-radius: 0;
    border-bottom: 2px solid transparent; margin-bottom: -1px; transition: .15s;
  }
  .content-tab:hover { color: var(--text); }
  .content-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .content-tab .tab-badge {
    display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px;
    background: var(--code-bg); color: var(--muted); font-size: 11px;
  }
  .content-tab.active .tab-badge { background: var(--accent-soft); color: var(--accent); }

  /* ---------- 文档页（YAML 编写） ---------- */
  .doc-toolbar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .doc-toolbar .spacer { flex: 1; }
  .doc-editor {
    width: 100%; min-height: 460px; padding: 14px 16px; border-radius: 8px;
    background: #fbfcfe; border: 1px solid var(--border-strong); outline: none;
    font-family: Consolas, Menlo, monospace; font-size: 13px; line-height: 1.65;
    color: var(--text); resize: vertical; tab-size: 2; white-space: pre; overflow-wrap: normal;
    overflow-x: auto;
  }
  .doc-editor:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
  .doc-result {
    margin-top: 12px; padding: 11px 14px; border-radius: 8px; font-size: 12.5px;
    line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  .doc-result.ok { background: var(--success-soft); color: var(--success); border: 1px solid #bfe6cd; }
  .doc-result.err { background: var(--danger-soft); color: var(--danger); border: 1px solid #f3c6c6;
    font-family: Consolas, Menlo, monospace; }
  .doc-spec {
    margin-top: 14px; padding: 12px 14px; border-radius: 8px;
    background: var(--code-bg); border: 1px solid var(--border); font-size: 12px; color: var(--muted);
  }
  .doc-spec b { color: var(--text); }
  .doc-spec code {
    background: #fff; padding: 1px 6px; border-radius: 4px; color: var(--accent);
    font-family: Consolas, Menlo, monospace;
  }
  .doc-spec ul { margin: 6px 0 0; padding-left: 20px; }
  .doc-spec li { margin-bottom: 4px; }

  /* ---------- 运行页：左列表 + 右详情 ---------- */
  .runs-layout { display: flex; gap: 16px; align-items: flex-start; }
  .runs-side {
    width: 320px; flex: 0 0 320px; background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-card); overflow: hidden;
    position: sticky; top: 0; max-height: calc(100vh - 130px); display: flex; flex-direction: column;
  }
  .runs-side-head {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .runs-side-head .title { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .5px; }
  .runs-side-head .spacer { flex: 1; }
  .run-list { overflow-y: auto; flex: 1; padding: 6px; }
  .run-item {
    padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 4px;
    cursor: pointer; border: 1px solid transparent; transition: .12s; background: transparent;
  }
  .run-item:hover { background: var(--accent-soft-2); }
  .run-item.active { background: var(--accent-soft); border-color: #c7d8ff; }
  .run-item .r1 { display: flex; align-items: center; gap: 8px; }
  .run-item .rid { font-weight: 600; font-size: 13px; }
  .run-item .r1 .spacer { flex: 1; }
  .run-item .r2 {
    font-size: 11.5px; color: var(--muted); margin-top: 4px;
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .run-item .rerr {
    font-size: 11.5px; color: var(--danger); margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .runs-main { flex: 1; min-width: 0; }

  /* ---------- 步骤详情 ---------- */
  .step {
    background: #fcfdff; border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
  }
  .step.failed { border-color: #f3c6c6; background: #fffafa; }
  .step-head {
    display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer;
  }
  .step-head:hover { background: var(--accent-soft-2); }
  .step-head .sname { font-weight: 500; }
  .step-head .spacer { flex: 1; }
  .step-head .arrow { color: var(--muted); font-size: 11px; transition: .15s; }
  .step.collapsed .arrow { transform: rotate(-90deg); }
  .step.collapsed .step-body { display: none; }
  .step-body { padding: 0 14px 14px; }
  .step-body .sec-label {
    font-size: 11px; font-weight: 600; color: var(--muted);
    letter-spacing: .5px; margin: 8px 0 4px; text-transform: uppercase;
  }
  .step-body pre { margin-top: 0; }
  .step-body pre.err { color: var(--danger); background: #fff5f5; border-color: #f3c6c6; }
  .step-empty { font-size: 12px; color: var(--muted); padding: 4px 0; }

  .sidebar-group { display: flex; flex-direction: column; gap: 4px; }
  .demo-cat + .demo-cat { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .demo-cat-name {
    font-size: 11px; font-weight: 600; color: var(--accent);
    letter-spacing: .5px; margin: 0 4px 6px;
  }
  .sidebar-demo-item {
    padding: 9px 11px; border-radius: var(--radius-sm);
    cursor: pointer; border: 1px solid transparent; transition: .12s;
    display: flex; align-items: center; gap: 8px;
  }
  .sidebar-demo-item:hover { background: var(--accent-soft-2); border-color: #dbe5fb; }
  .sidebar-demo-item .icon {
    width: 22px; height: 22px; border-radius: 5px;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .sidebar-demo-item .body { flex: 1; min-width: 0; }
  .sidebar-demo-item .dname { font-size: 13px; font-weight: 500; color: var(--text); }
  .sidebar-demo-item .ddesc { font-size: 11.5px; color: var(--muted); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="app">
  <div class="layout">
    <header class="topbar">
      <div class="logo">Flow<span>Go</span></div>
      <span class="badge">纯 Go · SQLite · 无 CGO</span>
      <div class="spacer"></div>
      <span class="badge">定时任务 <span id="jobCount">0</span></span>
      <span class="badge">节点 <span id="typeList"></span></span>
      <button class="btn" data-act="refreshStatus">系统状态</button>
    </header>

    <div class="main">
      <aside class="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-head" style="border:none;padding:0 4px 10px;">
            <h3>工作流</h3>
            <button class="btn small primary" data-act="createWorkflow">+ 新建</button>
          </div>
          <div class="wf-list" id="wfList"></div>
        </div>

        <div class="sidebar-section">
          <h4>示例 / Demos <span class="count" id="demoCount">0</span></h4>
          <div class="sidebar-group" id="demoSidebar"></div>
        </div>
      </aside>

      <section class="content" id="content"></section>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
(function () {
  'use strict';

  // POLL_INTERVAL 运行中（pending / running）时列表与详情的轮询间隔。
  var POLL_INTERVAL = 2000;
  // WATCH_INTERVAL 感知 Cron / Webhook 等外部触发新增运行记录的间隔。
  var WATCH_INTERVAL = 30000;

  var $ = function (sel, root) { return (root || document).querySelector(sel); };

  // DEMO_GROUP 内置示例工作流统一使用的分组，便于与正式工作流区分。
  var DEMO_GROUP = 'demo';

  // DEMO_CATEGORIES 示例分类，侧边栏与主区域按此分块展示。
  var DEMO_CATEGORIES = [
    { id: 'basic', name: '入门示例', desc: 'HTTP / Shell / Delay / Cron / Webhook 基础编排' },
    { id: 'ai', name: 'AI 工作流', desc: '用 ai_agent 节点让大模型分析数据并调用工具' }
  ];

  // 内置示例：点击即可一键创建成新工作流，所有示例统一归入 demo 分组。
  // 每个示例的 build() 返回一份完整的工作流草稿（含 graph），直接提交给后端。
  var DEMOS = [
    // ================= 入门示例 =================

  var busy = { saving: false, running: false, loadingRuns: false };

  // ---------- 工具 ----------
  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function api(url, options) {
    var opts = Object.assign({ headers: { 'Content-Type': 'application/json' } }, options || {});
    return fetch(url, opts).then(function (res) {
      return res.text().then(function (text) {
        var data = text ? JSON.parse(text) : null;
        if (!res.ok) throw new Error((data && data.error) || ('请求失败：' + res.status));
        return data;
      });
    });
  }

  var toastTimer = null;
  function showToast(msg, type) {
    var box = $('#toast');
    box.className = 'toast ' + (type || 'success');
    box.textContent = msg;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { box.className = ''; box.textContent = ''; }, 2600);
  }

  function pretty(raw) {
    if (!raw) return '';
    try { return JSON.stringify(JSON.parse(raw), null, 2); }
    catch (e) { return raw; }
  }

  function isActiveRun(status) { return status === 'pending' || status === 'running'; }

  function setPath(obj, path, value) {
    var parts = path.split('.');
    var cur = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      if (!cur[parts[i]]) cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = value;
  }

  function readValue(el) {
    if (el.type === 'checkbox') return el.checked;
    if (el.tagName === 'SELECT' && el.multiple) {
      return Array.prototype.slice.call(el.selectedOptions).map(function (o) { return o.value; });
    }
    if (el.type === 'number') return el.value === '' ? '' : Number(el.value);
    return el.value;
  }

  // ---------- 默认值 ----------
  function defaultsFor(type) {
    if (type === 'http') return { method: 'GET', url: '', headers: {}, body: '', timeout: 30 };
    if (type === 'shell') return { command: '', workdir: '', timeout: 60 };
    if (type === 'ai_agent') return {
      system_prompt: '', user_prompt: '', model: '', base_url: '', api_key: '',
      temperature: 0.2, max_iterations: 5, timeout: 60, tools: [], native_tools: false
    };
    return { seconds: 1 };
  }

  // ---------- 渲染：工作流侧栏（按分组聚合 + 每项右侧 × 删除） ----------
  function renderSidebar() {
    var box = $('#wfList');
    if (!state.workflows.length) {
      box.innerHTML = '<div class="empty" style="padding:24px 8px;font-size:12px;">暂无工作流，点击下方示例一键创建</div>';
      return;
    }

    // 按分组聚合：有 group 的归入对应组，无 group 的统一归入「未分组」。
    // 分组按名称排序；组内有自定义分组时把「demo」组放到最前以便快速识别示例。
    var groupOrder = [];
    var groupMap = {};
    state.workflows.forEach(function (wf) {
      var g = (wf.group && wf.group.trim()) || '未分组';
      if (!groupMap[g]) { groupMap[g] = []; groupOrder.push(g); }
      groupMap[g].push(wf);
    });
    groupOrder.sort(function (a, b) {
      if (a === '未分组') return 1;
      if (b === '未分组') return -1;
      if (a === 'demo') return -1;
      if (b === 'demo') return 1;
      return a.localeCompare(b);
    });

    var renderItem = function (wf) {
      var nodeCount = 0;
      try { nodeCount = (JSON.parse(wf.graph || '{}').nodes || []).length; } catch (e) { nodeCount = 0; }
      var active = state.current && state.current.id === wf.id ? ' active' : '';
      var dotColor = wf.enabled ? 'var(--success)' : 'var(--muted)';
      return '<div class="wf-item' + active + '" data-act="selectWorkflow" data-id="' + wf.id + '">' +
        '<div class="name">' +
          '<span style="color:' + dotColor + '">●</span>' +
          '<span class="wf-name-text" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(wf.name) + '</span>' +
          // × 删除按钮：靠 stopPropagation 阻止冒泡，避免触发 selectWorkflow。
          '<span class="wf-del" data-act="removeWorkflow" data-id="' + wf.id + '" title="删除该工作流">×</span>' +
        '</div>' +
        '<div class="meta">' +
          (wf.cron ? '⏱ ' + esc(wf.cron) : '未设定时') +
          (wf.group ? ' <span class="grp">' + esc(wf.group) + '</span>' : '') +
          ' · ' + nodeCount + ' 节点' +
        '</div>' +

  // docText 读取编辑器当前内容。
  function docText() {
    var el = $('#docEditor');
    return el ? el.value : '';
  }

  // setDocResult 在文档页显示操作结果，ok 为真表示成功。
  function setDocResult(msg, ok) {
    var box = $('#docResult');
    if (!box) return;
    box.className = 'doc-result ' + (ok ? 'ok' : 'err');
    box.textContent = msg;
  }

  // generateDoc 用当前编辑中的工作流生成文档。
  // 优先走后端渲染（保证与导入完全对称），未保存的工作流同样支持。
  function generateDoc(silent) {
    if (!state.current) return;
    try { buildGraph(); }
    catch (e) {
      if (!silent) setDocResult('生成失败：' + e.message, false);
      return;
    }
    var c = state.current;
    // 该接口返回纯文本 YAML 而非 JSON 信封，因此不能用 api()（它会尝试 JSON.parse）。
    return fetch('/api/workflows/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: c.name, description: c.description, enabled: c.enabled,
        cron: c.cron, group: c.group || '', graph: c.graph })
    }).then(function (res) {
      return res.text().then(function (text) {
        if (!res.ok) {
          var msg = text;
          try { msg = JSON.parse(text).error || text; } catch (e) { /* 非 JSON 原文返回 */ }
          throw new Error(msg);
        }
        var el = $('#docEditor');
        if (el) el.value = text;
        if (!silent) setDocResult('已根据当前表单生成文档', true);
        return text;
      });
    }).catch(function (e) {
      if (!silent) setDocResult('生成失败：' + e.message, false);
    });
  }

  // validateDoc 只做解析与校验，不落库。
  function validateDoc() {
    var text = docText();
    if (!text.trim()) { setDocResult('文档内容为空', false); return; }
    return fetch('/api/workflows/import?dry_run=1', {
      method: 'POST', headers: { 'Content-Type': 'text/yaml' }, body: text
    }).then(function (res) {
      return res.text().then(function (body) {
        if (!res.ok) {
          var msg = body;
          try { msg = JSON.parse(body).error || body; } catch (e) { /* 非 JSON 原文返回 */ }
          throw new Error(msg);
        }
        var wf = JSON.parse(body);
        var count = 0;
        try { count = (JSON.parse(wf.graph || '{}').nodes || []).length; } catch (e) { count = 0; }
        return '✓ 校验通过：' + count + ' 个节点，名称「' + wf.name + '」';
      });
    }).then(function (msg) { setDocResult(msg, true); })
      .catch(function (e) { setDocResult('✗ ' + e.message, false); });
  }

  // applyDoc 校验通过后把文档内容回填到编辑页的表单，用户可继续微调再保存。
  function applyDoc() {
    var text = docText();
    if (!text.trim()) { setDocResult('文档内容为空', false); return; }
    var wf;
    return fetch('/api/workflows/import?dry_run=1', {
      method: 'POST', headers: { 'Content-Type': 'text/yaml' }, body: text
    }).then(function (res) {
      return res.text().then(function (body) {
        if (!res.ok) {
          var msg = body;
          try { msg = JSON.parse(body).error || body; } catch (e) { /* 非 JSON 原文返回 */ }
          throw new Error(msg);
        }
        wf = JSON.parse(body);
      });
    }).then(function () {
      stopPolling();
      // 保留原 id 与 webhook_key：应用到表单不应改变工作流的身份。
      var keep = state.current || {};
      state.current = Object.assign({}, keep, {
        name: wf.name, description: wf.description, enabled: wf.enabled,
        cron: wf.cron, group: wf.group, graph: wf.graph
      });
      parseGraph();
      state.tab = 'edit';
      renderContent();
      setDocResult('');
      showToast('已应用到表单，确认无误后点「保存」');
    }).catch(function (e) { setDocResult('✗ ' + e.message, false); });
  }

  // importDoc 把文档直接创建为一个新的工作流。
  function importDoc() {
    var text = docText();
    if (!text.trim()) { setDocResult('文档内容为空', false); return; }
    return fetch('/api/workflows/import', {
      method: 'POST', headers: { 'Content-Type': 'text/yaml' }, body: text
    }).then(function (res) {
      return res.text().then(function (body) {
        if (!res.ok) {
          var msg = body;
          try { msg = JSON.parse(body).error || body; } catch (e) { /* 非 JSON 原文返回 */ }
          throw new Error(msg);
        }
        return JSON.parse(body);
      });
    }).then(function (wf) {
      // 导入完成后切到编辑页，让用户立即看到新建的工作流。
      state.tab = 'edit';
      showToast('已创建工作流「' + wf.name + '」');
      return loadWorkflows().then(function () { return selectWorkflow(wf); });
    }).catch(function (e) { setDocResult('✗ ' + e.message, false); });
  }

  // downloadDoc 把编辑器内容下载为 .yaml 文件。
  function downloadDoc() {
    var text = docText();
    if (!text.trim()) { setDocResult('文档内容为空，没有可下载的内容', false); return; }
    var name = (state.current && state.current.name) || 'workflow';
    var safe = name.replace(/[\\/:*?"<>|]/g, '_');
    var blob = new Blob([text], { type: 'text/yaml;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = safe + '.yaml';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setDocResult('已下载 ' + safe + '.yaml', true);
  }

          '<select multiple size="3" data-bind="config.tools" style="height:auto;">' +
            state.agentTools.map(function (t) {
              return '<option value="' + esc(t) + '"' + (tools.indexOf(t) >= 0 ? ' selected' : '') + '>' + esc(t) + '</option>';
            }).join('') +
          '</select>' +
          '<div class="hint">AI 只能在<strong>当前节点内部</strong>调用这些系统已注册的工具，不能新增/跳过节点、不能修改 DAG 结构；' +
          '工具结果会回传给 AI 继续分析，节点结束后再把结论交给下游节点</div>' +
        '</div>' +
        '<div class="field"><div class="switch">' +
          '<input type="checkbox" data-bind="config.native_tools"' + (cfg.native_tools ? ' checked' : '') + ' />' +
          '<span class="hint" style="margin:0;">使用原生 function calling（部分模型不支持时请关闭，走 JSON 文本协议）</span>' +
        '</div></div>';
    }

    var typeOpts = state.nodeTypes.map(function (t) {
      return '<option value="' + esc(t) + '"' + (n.type === t ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('');

    var depOpts = state.nodes.map(function (o) {
      var sel = (n.dependsOn || []).indexOf(o.id) >= 0 ? ' selected' : '';
      return '<option value="' + esc(o.id) + '"' + sel + (o.id === n.id ? ' disabled' : '') + '>' +
        esc(o.name || o.id) + ' (' + esc(o.type) + ')</option>';
    }).join('');

    return '<div class="node" data-idx="' + i + '">' +
      '<div class="node-head">' +
        '<div class="node-idx">' + (i + 1) + '</div>' +
        '<input type="text" data-bind="name" value="' + esc(n.name) + '" placeholder="节点名称" ' +
          'style="flex:1;background:transparent;border:none;outline:none;font-weight:500;" />' +
        '<select data-bind="type" data-act="changeType" style="width:120px;">' + typeOpts + '</select>' +
        '<span class="type-tag">' + esc(n.id) + '</span>' +
        '<button class="btn small" data-act="moveUp" data-idx="' + i + '"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button class="btn small" data-act="moveDown" data-idx="' + i + '"' + (i === state.nodes.length - 1 ? ' disabled' : '') + '>↓</button>' +
        '<button class="btn small danger" data-act="removeNode" data-idx="' + i + '">✕</button>' +
      '</div>' +
      body +
      '<div class="field" style="margin-top:10px;margin-bottom:0;">' +
        '<label>依赖的上游节点（可多选，用于确定执行顺序；留空则按列表顺序执行）</label>' +
        '<select multiple size="3" data-bind="dependsOn" style="height:auto;">' + depOpts + '</select>' +
      '</div>' +
    '</div>';
  }

  function renderNodes() {
    var box = $('#nodeList');
    if (!box) return;
    if (!state.nodes.length) {
      box.innerHTML = '<div class="empty" style="padding:20px 0;">还没有节点，点击右上「添加节点」开始编排</div>';
      return;
    }
    box.innerHTML = state.nodes.map(nodeHTML).join('');
  }

  // ---------- 渲染：运行记录列表（运行页左侧） ----------
  function renderRuns() {
    var box = $('#runsBox');
    if (!box) return;
    if (!state.runs.length) {
      box.innerHTML = '<div class="empty" style="padding:28px 8px;font-size:12px;">暂无运行记录</div>';
      return;
    }
    var activeID = state.detail ? state.detail.id : 0;
    box.innerHTML = state.runs.map(function (r) {
      var cls = 'run-item' + (r.id === activeID ? ' active' : '');
      return '<div class="' + cls + '" data-act="loadDetail" data-id="' + r.id + '">' +
        '<div class="r1">' +
          '<span class="rid mono">#' + r.id + '</span>' +
          '<span class="status ' + esc(r.status) + '">' + esc(r.status) + '</span>' +
          '<span class="spacer"></span>' +
          '<span class="hint" style="margin:0;">' + esc(r.duration_ms) + ' ms</span>' +
        '</div>' +
        '<div class="r2">' +
          '<span>' + esc(r.trigger) + '</span>' +
          '<span class="mono">' + esc(r.started_at || r.created_at) + '</span>' +
        '</div>' +
        (r.error ? '<div class="rerr" title="' + esc(r.error) + '">' + esc(r.error) + '</div>' : '') +
      '</div>';
    }).join('');
  }

  // ---------- 渲染：运行详情（运行页右侧，一次展示全部步骤结果） ----------
  function renderDetail() {
    var box = $('#detailBox');
    if (!box) return;
    var d = state.detail;
    if (!d) {
      box.innerHTML =
        '<div class="card"><div class="empty">' +
          '<div style="font-size:14px;">从左侧选择一次运行，查看每个步骤的输入与输出</div>' +
          '<div style="font-size:12px;margin-top:6px;">点击「▶ 运行并查看」或触发 Webhook 后，执行过程会自动出现在这里</div>' +
        '</div></div>';
      return;
    }

    var failedSteps = (d.steps || []).filter(function (s) { return s.status === 'failed'; }).length;

    // 每个步骤默认展开，点击标题可折叠；state.stepCollapsed 记录折叠状态。
    var steps = (d.steps || []).map(function (s, i) {
      var collapsed = state.stepCollapsed[d.id + ':' + i] ? ' collapsed' : '';
      var isFail = s.status === 'failed';
      var inTxt = pretty(s.input);
      var outTxt = pretty(s.output);
      return '<div class="step' + (isFail ? ' failed' : '') + collapsed + '">' +
        '<div class="step-head" data-act="toggleStep" data-idx="' + i + '">' +
          '<span class="node-idx">' + (i + 1) + '</span>' +
          '<span class="sname">' + esc(s.node_name || s.node_id) + '</span>' +
          '<span class="type-tag">' + esc(s.node_type) + '</span>' +
          '<span class="spacer"></span>' +
          '<span class="status ' + esc(s.status) + '">' + esc(s.status) + '</span>' +
          '<span class="hint" style="margin:0;">' + esc(s.duration_ms) + ' ms</span>' +
          '<span class="arrow">▼</span>' +
        '</div>' +
        '<div class="step-body">' +
          (s.input ? '<div class="sec-label">输入</div><pre>' + esc(inTxt) + '</pre>'
                   : '<div class="sec-label">输入</div><div class="step-empty">（无）</div>') +
          (s.output ? '<div class="sec-label">输出</div><pre>' + esc(outTxt) + '</pre>'
                    : '<div class="sec-label">输出</div><div class="step-empty">（无）</div>') +
          (s.error ? '<div class="sec-label">错误</div><pre class="err">' + esc(s.error) + '</pre>' : '') +
        '</div>' +
      '</div>';
    }).join('');

    box.innerHTML =
      '<div class="card">' +
        '<div class="card-title">运行详情 #' + d.id +
          (isActiveRun(d.status) ? '<span class="hint" style="margin:0;color:var(--warn);">● 执行中，每 2 秒自动刷新…</span>' : '') +
          '<div class="spacer"></div>' +
          '<button class="btn small" data-act="toggleAllSteps">' +
            (allStepsCollapsed(d) ? '全部展开' : '全部收起') +
          '</button>' +
          '<button class="btn small" data-act="refreshDetail">刷新</button>' +
          '<button class="btn small danger" data-act="closeDetail">关闭</button>' +
        '</div>' +
        '<div class="kv" style="margin-bottom:12px;">' +
          '<span>状态 <b><span class="status ' + esc(d.status) + '">' + esc(d.status) + '</span></b></span>' +
          '<span>触发方式 <b>' + esc(d.trigger) + '</b></span>' +
          '<span>耗时 <b>' + esc(d.duration_ms) + ' ms</b></span>' +
          '<span>开始 <b class="mono">' + esc(d.started_at) + '</b></span>' +
          '<span>步骤 <b>' + ((d.steps || []).length) + ' 个' +
            (failedSteps ? '（失败 ' + failedSteps + '）' : '') + '</b></span>' +
        '</div>' +
        (d.payload ? '<div class="field"><label>触发负载</label><pre>' + esc(pretty(d.payload)) + '</pre></div>' : '') +
        ((d.steps || []).length
          ? steps
          : '<div class="empty" style="padding:24px 0;">这次运行还没有步骤记录' +
            (isActiveRun(d.status) ? '，执行中请稍候…' : '') + '</div>') +
      '</div>';
  }

  // allStepsCollapsed 判断当前运行的步骤是否全部处于折叠态，用于切换按钮文案。
  function allStepsCollapsed(d) {
    var steps = d.steps || [];
    if (!steps.length) return false;
    return steps.every(function (s, i) { return !!state.stepCollapsed[d.id + ':' + i]; });
  }

  function renderTopbar() {
    $('#jobCount').textContent = state.schedulerJobs;
    $('#typeList').textContent = state.nodeTypes.join(' / ');
  }

  // updateRunBadge 刷新「运行记录」标签页上的数量角标，不重绘主体内容。
  function updateRunBadge() {
    var badge = document.querySelector('.content-tab[data-tab="runs"] .tab-badge');
    if (badge) badge.textContent = state.runs.length;
  }

  // ---------- 轮询 ----------
  function hasActiveRun() {
    var listActive = state.runs.some(function (r) { return isActiveRun(r.status); });
    return listActive || !!(state.detail && isActiveRun(state.detail.status));
  }

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(pollTick, POLL_INTERVAL);
    var tag = $('#pollingTag');
    if (tag) tag.style.display = '';
  }

  function stopPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = null;
    var tag = $('#pollingTag');
    if (tag) tag.style.display = 'none';
  }

  function syncPolling() {
    if (hasActiveRun()) startPolling(); else stopPolling();
  }

  function pollTick() {
    loadRuns(true).then(function () {
      if (state.detail) return loadDetail(state.detail.id, true);
    }).then(function () {
      if (!hasActiveRun()) stopPolling();
    });
  }

  function watchTick() {
    if (pollTimer || !state.current || !state.current.id) return;
    loadRuns(true).then(function (appeared) {
      if (appeared) showToast('检测到新的运行记录');
    });
  }

  // ---------- 业务 ----------
  function loadWorkflows() {
    return api('/api/workflows').then(function (list) {
      state.workflows = list || [];
      renderSidebar();
    });
  }

  function selectWorkflow(wf) {
    return api('/api/workflows/' + wf.id).then(function (full) {
      stopPolling();
      lastRunID = 0;
      state.current = full;
      state.detail = null;
      state.runFilter = full.id;
      parseGraph();
      renderSidebar();
      renderContent();
      state.docDraft = '';   // 切入新工作流，文档草稿清空，避免与上一个工作流串稿
      return loadRuns();
    });
  }

  function createWorkflow() {
    stopPolling();
    lastRunID = 0;
    state.current = {
      id: 0, name: '新工作流', description: '', enabled: true,
      cron: '', group: '', webhook_key: '', graph: ''
    };
    state.nodes = [];
    state.detail = null;
    state.runFilter = 0;
    state.runs = [];
    state.tab = 'edit';
    state.docDraft = '';
    renderSidebar();
    renderContent();
  }

  // focusRun 切换到运行记录页并选中某次运行，用于触发运行后立即观察执行过程。
  // placeholder 为触发接口直接返回的记录，可先占位渲染，随后由详情接口补全步骤。
  function focusRun(runID, placeholder) {
    state.runFilter = state.current ? state.current.id : 0;
    if (placeholder) state.detail = Object.assign({ steps: [] }, placeholder);
    state.tab = 'runs';
    renderContent();
    return loadRuns(true).then(function () {
      return runID ? loadDetail(runID, true) : null;
    }).then(function () {
      syncPolling();
    });
  }

  // loadDemo 根据用户在侧栏或主区域点选的示例模板，POST 到后端创建工作流，
  // 并在创建成功后自动打开。所有 demo 都统一打上 demo 分组便于辨识。
  function loadDemo(idx) {
    var demo = DEMOS[idx];
    if (!demo) return;
    var draft = demo.build();
    var payload = {
      name: draft.name,
      description: draft.description || demo.description,
      enabled: draft.enabled !== undefined ? draft.enabled : false,
      cron: draft.cron || '',
      group: draft.group || DEMO_GROUP,
      webhook_key: '',
      graph: JSON.stringify(draft.graph)
    };
    showToast('正在创建示例：' + demo.name);
    api('/api/workflows', { method: 'POST', body: JSON.stringify(payload) })
      .then(function (saved) {
        return loadWorkflows().then(function () { return selectWorkflow(saved); });
      })
      .then(function () { showToast('已加载示例：' + demo.name); })
      .catch(function (e) { showToast(e.message, 'error'); });
  }

  function parseGraph() {
    var graph = { nodes: [], edges: [] };
    try { graph = JSON.parse(state.current.graph || '{}'); } catch (e) { /* 空图 */ }
    var src = graph.nodes || [];
    var edges = graph.edges || [];
    nodeSeq = src.length;

    state.nodes = src.map(function (n) {
      var deps = edges.filter(function (e) { return e.target === n.id; })
                      .map(function (e) { return e.source; });
      var headers = (n.config && n.config.headers) || {};
      return {
        id: n.id,
        type: n.type,
        name: n.name || n.type,
        dependsOn: deps,
        headersText: Object.keys(headers).length ? JSON.stringify(headers, null, 2) : '',
        config: Object.assign(defaultsFor(n.type), n.config || {})
      };
    });
  }

  function buildGraph() {
    var ns = state.nodes.map(function (n) {
      var cfg = Object.assign({}, n.config);
      if (n.type === 'http') {
        var headers = {};
        if (n.headersText && n.headersText.trim()) {
          try { headers = JSON.parse(n.headersText); }
          catch (e) { throw new Error('节点「' + (n.name || n.id) + '」的请求头不是合法 JSON'); }
        }
        cfg.headers = headers;
      }
      return { id: n.id, type: n.type, name: n.name || n.type, config: cfg };
    });

    var edges = [];
    state.nodes.forEach(function (n) {
      (n.dependsOn || []).forEach(function (src) {
        edges.push({ source: src, target: n.id });
      });
    });

    state.current.graph = JSON.stringify({ nodes: ns, edges: edges });
  }

  function save() {
    if (!state.current) return;
    busy.saving = true;
    var btn = document.querySelector('[data-act="save"]');
    if (btn) btn.disabled = true;

    var go = function () {
      try { buildGraph(); }
      catch (e) { showToast(e.message, 'error'); return finish(); }

      var c = state.current;
      var body = JSON.stringify({
        name: c.name,
        description: c.description,
        enabled: c.enabled,
        cron: c.cron,
        group: c.group || '',
        webhook_key: c.webhook_key,
        graph: c.graph
      });

      var req = c.id
        ? api('/api/workflows/' + c.id, { method: 'PUT', body: body })
        : api('/api/workflows', { method: 'POST', body: body });

      return req.then(function (saved) {
        showToast('保存成功');
        return loadWorkflows().then(function () { return selectWorkflow(saved); });
      }).catch(function (e) {
        showToast(e.message, 'error');
      }).then(finish);
    };

    function finish() {
      busy.saving = false;
      var b = document.querySelector('[data-act="save"]');
      if (b) b.disabled = false;
    }

    return go();
  }

  function remove() {
    if (!state.current) return;
    if (!state.current.id) { createWorkflow(); return; }
    if (!confirm('确认删除工作流「' + state.current.name + '」？')) return;
    api('/api/workflows/' + state.current.id, { method: 'DELETE' }).then(function () {
      state.current = null;
      state.nodes = [];
      state.runs = [];
      state.detail = null;
      state.docDraft = '';
      stopPolling();
      return loadWorkflows();
    }).then(function () {
      renderContent();
      showToast('已删除');
    }).catch(function (e) { showToast(e.message, 'error'); });
  }

  // removeWorkflow 侧栏 × 触发的删除：先在本地找到工作流名用于确认弹窗，
  // 删除后若命中当前选中的工作流，回到空态并重新刷新侧栏。
  function removeWorkflow(id) {
    var wf = state.workflows.find(function (w) { return w.id === id; });
    var name = wf ? wf.name : ('#' + id);
    if (!confirm('确认删除工作流「' + name + '」？此操作不可恢复')) return;
    api('/api/workflows/' + id, { method: 'DELETE' }).then(function () {
      var wasCurrent = state.current && state.current.id === id;
      if (wasCurrent) {
        stopPolling();
        state.current = null; state.nodes = []; state.runs = []; state.detail = null;
        state.docDraft = '';
      }
      return loadWorkflows().then(function () {
        if (wasCurrent) renderContent();
        renderSidebar();
        showToast('已删除「' + name + '」');
      });
    }).catch(function (e) { showToast(e.message, 'error'); });
  }

  function addNode() {
    nodeSeq++;
    var id = 'n' + nodeSeq;
    state.nodes.push({
      id: id, type: 'http', name: '节点 ' + nodeSeq,
      dependsOn: [], headersText: '', config: defaultsFor('http')
    });
    renderNodes();
  }

  function setFilter(id) {
    state.runFilter = id;
    lastRunID = 0;
    renderTabs();
    loadRuns();
  }

  // loadRuns 拉取运行记录列表，silent 为真时不显示加载态与错误提示（轮询用）。
  // 返回值表示本次是否出现了比上次更新的运行记录。
  function loadRuns(silent) {
    if (!silent) busy.loadingRuns = true;
    var id = state.runFilter || (state.current && state.current.id);
    return api('/api/runs?workflow_id=' + (id || '') + '&limit=30').then(function (list) {
      state.runs = list || [];
      var maxID = state.runs.reduce(function (m, r) { return r.id > m ? r.id : m; }, 0);
      var appeared = lastRunID > 0 && maxID > lastRunID;
      lastRunID = maxID;
      renderRuns();
      updateRunBadge();
      syncPolling();
      return appeared;
    }).catch(function (e) {
      if (!silent) showToast(e.message, 'error');
      return false;
    }).then(function (v) {
      if (!silent) busy.loadingRuns = false;
      return v;
    });
  }

  function loadDetail(id, silent) {
    return api('/api/runs/' + id).then(function (d) {
      state.detail = d;
      renderRuns();   // 同步刷新左侧列表的选中高亮
      renderDetail();
      syncPolling();
    }).catch(function (e) {
      if (!silent) showToast(e.message, 'error');
    });
  }

  function runNow() {
    if (!state.current || !state.current.id) { showToast('请先保存工作流', 'error'); return; }
    busy.running = true;
    api('/api/workflows/' + state.current.id + '/run', {
      method: 'POST', body: JSON.stringify({ source: 'web-ui' })
    }).then(function (run) {
      showToast('已触发运行 #' + run.id + '，正在跳转到运行记录页');
      // 先用触发返回的记录占位，详情立即可见，再由详情接口补全各步骤日志。
      return focusRun(run.id, run);
    }).catch(function (e) {
      showToast(e.message, 'error');
    }).then(function () { busy.running = false; });
  }

  function testWebhook() {
    if (!state.current || !state.current.id) { showToast('请先保存工作流', 'error'); return; }
    fetch('/hook/' + encodeURIComponent(state.current.webhook_key), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source: 'webhook-test', at: new Date().toISOString() })
    }).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || '触发失败');
        showToast('Webhook 已触发，运行 #' + data.run_id);
        return focusRun(data.run_id, null);
      });
    }).catch(function (e) { showToast(e.message, 'error'); });
  }

  function copyWebhook() {
    var el = $('#webhookURL');
    var text = el ? el.value : '';
    if (!text) { showToast('请先保存工作流', 'error'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { showToast('已复制到剪贴板'); },
        function () { showToast('复制失败，请手动复制', 'error'); }
      );
    } else {
      el.select();
      showToast('请按 Ctrl+C 复制');
    }
  }

  function refreshStatus() {
    api('/status').then(function (s) {
      showToast('CPU ' + s.cpu.usage.toFixed(1) + '% · 内存 ' + s.memory.usage.toFixed(1) + '% · 运行 ' + s.uptime + 's');
    }).catch(function (e) { showToast(e.message, 'error'); });
  }

  // loadMeta 并行拉取节点类型、Agent 工具与调度状态。
  // 必须返回 Promise：启动流程依赖它串起 loadWorkflows，否则后续加载不会执行。
  function loadMeta() {
    return Promise.all([
      api('/api/node-types').then(function (t) {
        state.nodeTypes = t; renderTopbar();
        renderNodes();
      }).catch(function () { /* 元数据加载失败不影响主流程 */ }),

      api('/api/agent-tools').then(function (t) {
        state.agentTools = t; renderNodes();
      }).catch(function () { /* 保留默认工具清单 */ }),

      api('/health').then(function (h) {
        state.schedulerJobs = (h.data && h.data.scheduler_jobs) || 0;
        renderTopbar();
      }).catch(function () { /* 健康检查失败不提示 */ })
    ]);
  }

  // ---------- 事件绑定 ----------
  // 工作流基本信息字段：输入即写回 state，不重渲染，避免输入框失焦。
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;

    var wfKey = el.getAttribute('data-wf');
    if (wfKey && state.current) {
      state.current[wfKey] = readValue(el);
      return;
    }

    var bind = el.getAttribute('data-bind');
    if (bind) {
      var wrap = el.closest('.node');
      if (!wrap) return;
      var n = state.nodes[Number(wrap.getAttribute('data-idx'))];
      if (!n) return;
      setPath(n, bind, readValue(el));
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;

    var wfKey = el.getAttribute('data-wf');
    if (wfKey && state.current) {
      state.current[wfKey] = readValue(el);
      return;
    }

    var bind = el.getAttribute('data-bind');
    if (!bind) return;
    var wrap = el.closest('.node');
    if (!wrap) return;
    var idx = Number(wrap.getAttribute('data-idx'));
    var n = state.nodes[idx];
    if (!n) return;

    // 切换节点类型时重建默认配置并整体重绘节点区。
    if (bind === 'type') {
      n.config = defaultsFor(el.value);
      renderNodes();
      return;
    }
    setPath(n, bind, readValue(el));
  });

  // 统一处理所有按钮点击。
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var idx = Number(el.getAttribute('data-idx'));
    var id = el.getAttribute('data-id');

    switch (act) {
      case 'selectWorkflow':
        loadWorkflows().then(function () {});
        api('/api/workflows/' + id).then(function (full) {
          stopPolling();
          lastRunID = 0;
          state.current = full;
          state.detail = null;
          state.runFilter = full.id;
          parseGraph();
          renderSidebar();
          renderContent();
          return loadRuns();
        }).catch(function (err) { showToast(err.message, 'error'); });
        break;

      case 'loadDemo':
        loadDemo(idx);
        break;

      case 'switchTab':
        switchTab(el.getAttribute('data-tab'));
        break;

      case 'genDoc': generateDoc(false); break;
      case 'validateDoc': validateDoc(); break;
      case 'applyDoc': applyDoc(); break;
      case 'importDoc': importDoc(); break;
      case 'downloadDoc': downloadDoc(); break;

      case 'toggleStep':
        // 折叠/展开单个步骤，仅改 class 避免整块重绘导致闪烁。
        var stepEl = el.closest('.step');
        var d0 = state.detail;
        if (stepEl && d0) {
          var key = d0.id + ':' + idx;
          var next = !stepEl.classList.contains('collapsed');
          state.stepCollapsed[key] = next;
          stepEl.classList.toggle('collapsed', next);
          var btn = document.querySelector('[data-act="toggleAllSteps"]');
          if (btn) btn.textContent = allStepsCollapsed(d0) ? '全部展开' : '全部收起';
        }
        break;

      case 'toggleAllSteps':
        var dAll = state.detail;
        if (dAll) {
          var collapse = !allStepsCollapsed(dAll);
          (dAll.steps || []).forEach(function (s, i) { state.stepCollapsed[dAll.id + ':' + i] = collapse; });
          renderDetail();
        }
        break;

      case 'refreshDetail':
        if (state.detail) loadDetail(state.detail.id);
        break;

      case 'createWorkflow': createWorkflow(); break;
      case 'save': save(); break;
      case 'remove': remove(); break;
      case 'removeWorkflow':
        // 阻止冒泡到外层 .wf-item，避免触发了 selectWorkflow 又弹删除确认。
        e.stopPropagation(); e.preventDefault();
        removeWorkflow(Number(id));
        break;
      case 'runNow': runNow(); break;
      case 'testWebhook': testWebhook(); break;
      case 'copyWebhook': copyWebhook(); break;
      case 'refreshStatus': refreshStatus(); break;

      case 'addNode': addNode(); break;
      case 'removeNode':
        var removed = state.nodes[idx].id;
        state.nodes.splice(idx, 1);
        state.nodes.forEach(function (n) {
          n.dependsOn = (n.dependsOn || []).filter(function (d) { return d !== removed; });
        });
        renderNodes();
        break;
      case 'moveUp':
        if (idx > 0) state.nodes.splice(idx - 1, 0, state.nodes.splice(idx, 1)[0]);
        renderNodes();
        break;
      case 'moveDown':
        if (idx < state.nodes.length - 1) state.nodes.splice(idx + 1, 0, state.nodes.splice(idx, 1)[0]);
        renderNodes();
        break;

      case 'refreshRuns': loadRuns(); break;
      case 'setFilter': setFilter(Number(id)); break;
      case 'loadDetail': loadDetail(Number(id)); break;
      case 'closeDetail':
        state.detail = null;
        renderDetail();
        syncPolling();
        break;
    }
  });

  // ---------- 启动 ----------
  renderTopbar();
  renderDemosSidebar();
  renderSidebar();
  renderContent();

  loadMeta().then(loadWorkflows).then(function () {
    if (state.workflows.length) return selectWorkflow(state.workflows[0]);
  }).catch(function () { /* 启动失败保持空态 */ });

  // 定时感知定时任务 / Webhook 等外部触发产生的新运行记录。
  watchTimer = setInterval(watchTick, WATCH_INTERVAL);
})();
</script>
</body>
</html>
