<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowGo · 工作流编排</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171d2b;
    --panel-2: #1e2637;
    --border: #2a3448;
    --text: #e6ebf5;
    --muted: #8b98b0;
    --accent: #4f8cff;
    --accent-soft: rgba(79, 140, 255, 0.14);
    --success: #2ecc8f;
    --danger: #ff5c5c;
    --warn: #ffb020;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI", -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
  }
  #app { height: 100%; }
  button, input, select, textarea {
    font-family: inherit; font-size: 13px; color: var(--text);
  }
  button { cursor: pointer; }

  /* ---------- 布局 ---------- */
  .layout { display: flex; flex-direction: column; height: 100%; }
  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 0 20px; height: 56px; flex: 0 0 56px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .logo { font-size: 17px; font-weight: 600; letter-spacing: .5px; }
  .logo span { color: var(--accent); }
  .topbar .spacer { flex: 1; }
  .badge {
    padding: 3px 9px; border-radius: 20px; font-size: 12px;
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
  }
  .main { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 260px; flex: 0 0 260px; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .sidebar-head {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-head h3 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .4px; }
  .wf-list { overflow-y: auto; flex: 1; padding: 8px; }
  .wf-item {
    padding: 10px 12px; border-radius: var(--radius); margin-bottom: 6px;
    cursor: pointer; border: 1px solid transparent; transition: .15s;
  }
  .wf-item:hover { background: var(--panel-2); }
  .wf-item.active { background: var(--accent-soft); border-color: var(--accent); }
  .wf-item .name { font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .wf-item .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .wf-item .meta .grp { color: var(--accent); }
  .content { flex: 1; overflow-y: auto; padding: 20px 24px 60px; }

  /* ---------- 控件 ---------- */
  .btn {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); transition: .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px;
  }
  .card-title {
    font-size: 13px; font-weight: 600; color: var(--muted);
    letter-spacing: .5px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
  }
  .card-title .spacer { flex: 1; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input[type=text], .field input[type=number], .field select, .field textarea {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--border); outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 72px; font-family: Consolas, Menlo, monospace; font-size: 12.5px; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .switch { display: flex; align-items: center; gap: 8px; }
  .switch input { width: auto; }

  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .hint code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; color: var(--accent); }

  /* ---------- 节点 ---------- */
  .node {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
  }
  .node-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .node-idx {
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; flex: 0 0 22px;
  }
  .node-head .spacer { flex: 1; }
  .type-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
    background: rgba(255,255,255,.06); color: var(--muted); text-transform: uppercase; letter-spacing: .5px;
  }

  /* ---------- 运行记录 ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tbody tr:hover { background: var(--panel-2); }
  tbody tr.clickable { cursor: pointer; }
  .status {
    padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500;
  }
  .status.success { background: rgba(46,204,143,.15); color: var(--success); }
  .status.failed  { background: rgba(255,92,92,.15);  color: var(--danger); }
  .status.running { background: rgba(255,176,32,.15); color: var(--warn); }
  .status.pending { background: rgba(139,152,176,.15); color: var(--muted); }

  .log-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel-2); }
  .log-head { display: flex; align-items: center; gap: 10px; }
  .log-head .spacer { flex: 1; }
  pre {
    margin: 8px 0 0; padding: 10px; border-radius: 6px; background: #0b0f18;
    border: 1px solid var(--border); overflow-x: auto;
    font-family: Consolas, Menlo, monospace; font-size: 12px; color: #b9c6dd;
    white-space: pre-wrap; word-break: break-all; max-height: 260px; overflow-y: auto;
  }
  .empty { text-align: center; padding: 40px 0; color: var(--muted); }
  .toast {
    position: fixed; right: 20px; bottom: 20px; padding: 10px 16px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--border); z-index: 99;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.success { border-color: var(--success); color: var(--success); }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab {
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--muted);
  }
  .tab.active { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
  .kv { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .kv b { color: var(--text); font-weight: 500; }
  .mono { font-family: Consolas, Menlo, monospace; }
</style>
</head>
<body>
<div id="app">
  <div class="layout">
    <header class="topbar">
      <div class="logo">Flow<span>Go</span></div>
      <span class="badge">纯 Go · SQLite · 无 CGO</span>
      <div class="spacer"></div>
      <span class="badge">定时任务 <span id="jobCount">0</span></span>
      <span class="badge">节点 <span id="typeList"></span></span>
      <button class="btn" data-act="refreshStatus">系统状态</button>
    </header>

    <div class="main">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h3>工作流</h3>
          <button class="btn small primary" data-act="createWorkflow">+ 新建</button>
        </div>
        <div class="wf-list" id="wfList"></div>
      </aside>

      <section class="content" id="content"></section>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
(function () {
  'use strict';

  // POLL_INTERVAL 运行中（pending / running）时列表与详情的轮询间隔。
  var POLL_INTERVAL = 2000;
  // WATCH_INTERVAL 感知 Cron / Webhook 等外部触发新增运行记录的间隔。
  var WATCH_INTERVAL = 30000;

  var $ = function (sel, root) { return (root || document).querySelector(sel); };

  var state = {
    workflows: [],
    current: null,
    nodes: [],
    runs: [],
    detail: null,
    nodeTypes: ['http', 'shell', 'delay', 'ai_agent'],
    agentTools: ['http-call', 'shell-run', 'delay-sleep'],
    schedulerJobs: 0,
    runFilter: 0
  };

  var nodeSeq = 0;
  var pollTimer = null;   // 运行中详情/列表的轮询定时器
  var watchTimer = null;  // 外部触发感知定时器
  var lastRunID = 0;      // 已知的最大运行记录 ID，用于发现新运行
  var busy = { saving: false, running: false, loadingRuns: false };

  // ---------- 工具 ----------
  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function api(url, options) {
    var opts = Object.assign({ headers: { 'Content-Type': 'application/json' } }, options || {});
    return fetch(url, opts).then(function (res) {
      return res.text().then(function (text) {
        var data = text ? JSON.parse(text) : null;
        if (!res.ok) throw new Error((data && data.error) || ('请求失败：' + res.status));
        return data;
      });
    });
  }

  var toastTimer = null;
  function showToast(msg, type) {
    var box = $('#toast');
    box.className = 'toast ' + (type || 'success');
    box.textContent = msg;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { box.className = ''; box.textContent = ''; }, 2600);
  }

  function pretty(raw) {
    if (!raw) return '';
    try { return JSON.stringify(JSON.parse(raw), null, 2); }
    catch (e) { return raw; }
  }

  function isActiveRun(status) { return status === 'pending' || status === 'running'; }

  function setPath(obj, path, value) {
    var parts = path.split('.');
    var cur = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      if (!cur[parts[i]]) cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = value;
  }

  function readValue(el) {
    if (el.type === 'checkbox') return el.checked;
    if (el.tagName === 'SELECT' && el.multiple) {
      return Array.prototype.slice.call(el.selectedOptions).map(function (o) { return o.value; });
    }
    if (el.type === 'number') return el.value === '' ? '' : Number(el.value);
    return el.value;
  }

  // ---------- 默认值 ----------
  function defaultsFor(type) {
    if (type === 'http') return { method: 'GET', url: '', headers: {}, body: '', timeout: 30 };
    if (type === 'shell') return { command: '', workdir: '', timeout: 60 };
    if (type === 'ai_agent') return {
      system_prompt: '', user_prompt: '', model: '', base_url: '', api_key: '',
      temperature: 0.2, max_iterations: 5, timeout: 60, tools: [], native_tools: false
    };
    return { seconds: 1 };
  }

  // ---------- 渲染：侧边栏 ----------
  function renderSidebar() {
    var box = $('#wfList');
    if (!state.workflows.length) {
      box.innerHTML = '<div class="empty" style="padding:24px 8px;font-size:12px;">暂无工作流</div>';
      return;
    }
    box.innerHTML = state.workflows.map(function (wf) {
      var nodeCount = 0;
      try { nodeCount = (JSON.parse(wf.graph || '{}').nodes || []).length; } catch (e) { nodeCount = 0; }
      var active = state.current && state.current.id === wf.id ? ' active' : '';
      var dotColor = wf.enabled ? 'var(--success)' : 'var(--muted)';
      return '<div class="wf-item' + active + '" data-act="selectWorkflow" data-id="' + wf.id + '">' +
        '<div class="name"><span style="color:' + dotColor + '">●</span>' + esc(wf.name) + '</div>' +
        '<div class="meta">' +
          (wf.cron ? '⏱ ' + esc(wf.cron) : '未设定时') +
          (wf.group ? ' <span class="grp">组:' + esc(wf.group) + '</span>' : '') +
          ' · ' + nodeCount + ' 节点' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // ---------- 渲染：主区域 ----------
  function renderContent() {
    var box = $('#content');
    if (!state.current) {
      box.innerHTML =
        '<div class="empty">' +
          '<div style="font-size:15px;margin-bottom:8px;">从左侧选择一个工作流，或新建一个</div>' +
          '<div style="font-size:12px;">支持 http / shell / delay 节点，可插入 ai_agent 节点让大模型在节点内分析并调用工具，可由 Webhook 或 Cron 触发</div>' +
        '</div>';
      return;
    }

    var c = state.current;
    var webhookURL = c.webhook_key ? (location.origin + '/hook/' + encodeURIComponent(c.webhook_key)) : '';

    box.innerHTML =
      // 基本信息
      '<div class="card">' +
        '<div class="card-title">基本信息<div class="spacer"></div>' +
          '<button class="btn small primary" data-act="save">保存</button> ' +
          '<button class="btn small" data-act="runNow">▶ 运行</button> ' +
          '<button class="btn small danger" data-act="remove">删除</button>' +
        '</div>' +
        '<div class="row">' +
          '<div class="field"><label>名称</label>' +
            '<input type="text" data-wf="name" value="' + esc(c.name) + '" placeholder="例如：每日数据同步" /></div>' +
          '<div class="field"><label>描述</label>' +
            '<input type="text" data-wf="description" value="' + esc(c.description) + '" placeholder="可选" /></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="field"><label>Cron 表达式（留空表示不定时）</label>' +
            '<input type="text" data-wf="cron" value="' + esc(c.cron) + '" placeholder="0 8 * * * 或 @every 1h" />' +
            '<div class="hint">支持 5 段 <code>分 时 日 月 周</code> 或 6 段（首位为秒），也可用 <code>@every 30s</code> / <code>@hourly</code></div>' +
          '</div>' +
          '<div class="field"><label>启用</label>' +
            '<div class="switch">' +
              '<input type="checkbox" data-wf="enabled"' + (c.enabled ? ' checked' : '') + ' />' +
              '<span class="hint" style="margin:0;">关闭后 Webhook 与定时任务都不会触发</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="field"><label>分组（同一分组内的工作流串行执行，不同分组并行；留空则各自独立）</label>' +
            '<input type="text" data-wf="group" value="' + esc(c.group || '') + '" placeholder="例如：mailer / etl，留空表示不分组" />' +
            '<div class="hint">定时调度时，同分组的工作流同时仅运行一个实例，避免重复执行副作用</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      // Webhook
      '<div class="card">' +
        '<div class="card-title">Webhook 触发</div>' +
        '<div class="field">' +
          '<label>调用地址（外部系统 POST 此地址即可触发流程）</label>' +
          '<div style="display:flex;gap:8px;">' +
            '<input type="text" class="mono" id="webhookURL" value="' + esc(webhookURL) + '" readonly />' +
            '<button class="btn" data-act="copyWebhook">复制</button>' +
            '<button class="btn" data-act="testWebhook">测试</button>' +
          '</div>' +
          '<div class="hint">请求体 / 表单 / 查询参数会作为 <code>{{ .trigger.xxx }}</code> 注入节点配置</div>' +
        '</div>' +
      '</div>' +

      // 节点编排
      '<div class="card">' +
        '<div class="card-title">节点编排<div class="spacer"></div>' +
          '<button class="btn small" data-act="addNode">+ 添加节点</button>' +
        '</div>' +
        '<div id="nodeList"></div>' +
        '<div class="hint" style="margin-top:10px;">' +
          '节点输出可用 <code>{{ .nodes.&lt;节点ID&gt;.字段 }}</code> 在后续节点中引用，' +
          '例如 http 节点的 <code>{{ .nodes.n1.body }}</code>、<code>{{ .nodes.n1.status_code }}</code>、' +
          'ai_agent 节点的 <code>{{ .nodes.n2.answer }}</code>' +
          '（省略前导点写成 <code>{{ nodes.n1.body }}</code> 亦可）' +
        '</div>' +
      '</div>' +

      // 运行记录
      '<div class="card">' +
        '<div class="card-title">运行记录' +
          '<span id="pollingTag" class="hint" style="margin:0;color:var(--warn);display:none;">● 运行中，自动刷新</span>' +
          '<div class="spacer"></div>' +
          '<button class="btn small" data-act="refreshRuns">刷新</button>' +
        '</div>' +
        '<div class="tabs">' +
          '<button class="tab" data-act="setFilter" data-id="0">全部</button>' +
          '<button class="tab" data-act="setFilter" data-id="' + c.id + '">当前工作流</button>' +
        '</div>' +
        '<div id="runsBox"></div>' +
      '</div>' +

      // 运行详情
      '<div id="detailBox"></div>';

    renderNodes();
    renderRuns();
    renderDetail();
    renderTabs();
    syncPolling();
  }

  function renderTabs() {
    var btns = document.querySelectorAll('[data-act="setFilter"]');
    for (var i = 0; i < btns.length; i++) {
      var id = Number(btns[i].getAttribute('data-id'));
      btns[i].className = 'tab' + (id === state.runFilter ? ' active' : '');
    }
  }

  // ---------- 渲染：节点 ----------
  function nodeHTML(n, i) {
    var cfg = n.config || {};
    var body = '';

    if (n.type === 'http') {
      body =
        '<div class="row">' +
          '<div class="field"><label>方法</label>' +
            '<select data-bind="config.method">' +
              ['GET', 'POST', 'PUT', 'PATCH', 'DELETE'].map(function (m) {
                return '<option' + (cfg.method === m ? ' selected' : '') + '>' + m + '</option>';
              }).join('') +
            '</select>' +
          '</div>' +
          '<div class="field"><label>超时（秒）</label>' +
            '<input type="number" data-bind="config.timeout" value="' + esc(cfg.timeout) + '" /></div>' +
        '</div>' +
        '<div class="field"><label>URL</label>' +
          '<input type="text" class="mono" data-bind="config.url" value="' + esc(cfg.url) + '" placeholder="https://api.example.com/hook" /></div>' +
        '<div class="field"><label>请求头（JSON 对象）</label>' +
          '<textarea data-bind="headersText" placeholder=\'{"Authorization":"Bearer xxx"}\'>' + esc(n.headersText || '') + '</textarea></div>' +
        '<div class="field"><label>请求体</label>' +
          '<textarea data-bind="config.body" placeholder="{{ .trigger.order_id }}">' + esc(cfg.body || '') + '</textarea></div>';
    } else if (n.type === 'shell') {
      body =
        '<div class="row">' +
          '<div class="field"><label>超时（秒）</label>' +
            '<input type="number" data-bind="config.timeout" value="' + esc(cfg.timeout) + '" /></div>' +
          '<div class="field"><label>工作目录（可选）</label>' +
            '<input type="text" data-bind="config.workdir" value="' + esc(cfg.workdir || '') + '" /></div>' +
        '</div>' +
        '<div class="field"><label>命令</label>' +
          '<textarea class="mono" data-bind="config.command" placeholder="echo hello">' + esc(cfg.command || '') + '</textarea>' +
          '<div class="hint">Windows 默认 PowerShell，Linux / macOS 默认 <code>/bin/sh -c</code>；退出码非 0 视为失败</div>' +
        '</div>';
    } else if (n.type === 'delay') {
      body =
        '<div class="field"><label>等待秒数</label>' +
          '<input type="number" data-bind="config.seconds" value="' + esc(cfg.seconds) + '" /></div>';
    } else if (n.type === 'ai_agent') {
      var tools = Array.isArray(cfg.tools) ? cfg.tools : [];
      body =
        '<div class="row">' +
          '<div class="field"><label>模型</label>' +
            '<input type="text" class="mono" data-bind="config.model" value="' + esc(cfg.model || '') + '" placeholder="gpt-4o-mini / qwen-plus" /></div>' +
          '<div class="field"><label>接口地址（OpenAI 兼容）</label>' +
            '<input type="text" class="mono" data-bind="config.base_url" value="' + esc(cfg.base_url || '') + '" placeholder="https://api.openai.com/v1" /></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="field"><label>API Key（留空则使用 config.yaml 的 llm.api_key）</label>' +
            '<input type="text" class="mono" data-bind="config.api_key" value="' + esc(cfg.api_key || '') + '" placeholder="sk-xxx" /></div>' +
          '<div class="field"><label>单次请求超时（秒）</label>' +
            '<input type="number" data-bind="config.timeout" value="' + esc(cfg.timeout) + '" /></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="field"><label>最大思考轮次（1-20）</label>' +
            '<input type="number" data-bind="config.max_iterations" value="' + esc(cfg.max_iterations) + '" /></div>' +
          '<div class="field"><label>温度</label>' +
            '<input type="number" step="0.1" data-bind="config.temperature" value="' + esc(cfg.temperature) + '" /></div>' +
        '</div>' +
        '<div class="field"><label>系统提示词（任务指令，支持模板变量）</label>' +
          '<textarea data-bind="config.system_prompt" placeholder="分析上游 http 返回的数据，命中标记时调用 shell-run 输出日志，最后给出结论">' + esc(cfg.system_prompt || '') + '</textarea></div>' +
        '<div class="field"><label>补充指令（可选）</label>' +
          '<textarea data-bind="config.user_prompt" placeholder="例如：只输出命中的 URL 列表，用 JSON 数组">' + esc(cfg.user_prompt || '') + '</textarea></div>' +
        '<div class="field"><label>允许调用的工具（不选表示全部）</label>' +
          '<select multiple size="3" data-bind="config.tools" style="height:auto;">' +
            state.agentTools.map(function (t) {
              return '<option value="' + esc(t) + '"' + (tools.indexOf(t) >= 0 ? ' selected' : '') + '>' + esc(t) + '</option>';
            }).join('') +
          '</select>' +
          '<div class="hint">AI 只能在<strong>当前节点内部</strong>调用这些系统已注册的工具，不能新增/跳过节点、不能修改 DAG 结构；' +
          '工具结果会回传给 AI 继续分析，节点结束后再把结论交给下游节点</div>' +
        '</div>' +
        '<div class="field"><div class="switch">' +
          '<input type="checkbox" data-bind="config.native_tools"' + (cfg.native_tools ? ' checked' : '') + ' />' +
          '<span class="hint" style="margin:0;">使用原生 function calling（部分模型不支持时请关闭，走 JSON 文本协议）</span>' +
        '</div></div>';
    }

    var typeOpts = state.nodeTypes.map(function (t) {
      return '<option value="' + esc(t) + '"' + (n.type === t ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('');

    var depOpts = state.nodes.map(function (o) {
      var sel = (n.dependsOn || []).indexOf(o.id) >= 0 ? ' selected' : '';
      return '<option value="' + esc(o.id) + '"' + sel + (o.id === n.id ? ' disabled' : '') + '>' +
        esc(o.name || o.id) + ' (' + esc(o.type) + ')</option>';
    }).join('');

    return '<div class="node" data-idx="' + i + '">' +
      '<div class="node-head">' +
        '<div class="node-idx">' + (i + 1) + '</div>' +
        '<input type="text" data-bind="name" value="' + esc(n.name) + '" placeholder="节点名称" ' +
          'style="flex:1;background:transparent;border:none;outline:none;font-weight:500;" />' +
        '<select data-bind="type" data-act="changeType" style="width:120px;">' + typeOpts + '</select>' +
        '<span class="type-tag">' + esc(n.id) + '</span>' +
        '<button class="btn small" data-act="moveUp" data-idx="' + i + '"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button class="btn small" data-act="moveDown" data-idx="' + i + '"' + (i === state.nodes.length - 1 ? ' disabled' : '') + '>↓</button>' +
        '<button class="btn small danger" data-act="removeNode" data-idx="' + i + '">✕</button>' +
      '</div>' +
      body +
      '<div class="field" style="margin-top:10px;margin-bottom:0;">' +
        '<label>依赖的上游节点（可多选，用于确定执行顺序；留空则按列表顺序执行）</label>' +
        '<select multiple size="3" data-bind="dependsOn" style="height:auto;">' + depOpts + '</select>' +
      '</div>' +
    '</div>';
  }

  function renderNodes() {
    var box = $('#nodeList');
    if (!box) return;
    if (!state.nodes.length) {
      box.innerHTML = '<div class="empty" style="padding:20px 0;">还没有节点，点击右上「添加节点」开始编排</div>';
      return;
    }
    box.innerHTML = state.nodes.map(nodeHTML).join('');
  }

  // ---------- 渲染：运行记录 ----------
  function renderRuns() {
    var box = $('#runsBox');
    if (!box) return;
    if (!state.runs.length) {
      box.innerHTML = '<div class="empty" style="padding:24px 0;">暂无运行记录</div>';
      return;
    }
    box.innerHTML =
      '<table><thead><tr>' +
        '<th style="width:60px;">ID</th><th style="width:110px;">状态</th><th style="width:90px;">触发</th>' +
        '<th style="width:150px;">开始时间</th><th style="width:90px;">耗时</th><th>错误信息</th>' +
      '</tr></thead><tbody>' +
      state.runs.map(function (r) {
        return '<tr class="clickable" data-act="loadDetail" data-id="' + r.id + '">' +
          '<td class="mono">' + r.id + '</td>' +
          '<td><span class="status ' + esc(r.status) + '">' + esc(r.status) + '</span></td>' +
          '<td>' + esc(r.trigger) + '</td>' +
          '<td class="mono">' + esc(r.started_at || r.created_at) + '</td>' +
          '<td>' + esc(r.duration_ms) + ' ms</td>' +
          '<td' + (r.error ? ' style="color:var(--danger)"' : '') + '>' + esc(r.error || '-') + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody></table>';
  }

  // ---------- 渲染：运行详情 ----------
  function renderDetail() {
    var box = $('#detailBox');
    if (!box) return;
    var d = state.detail;
    if (!d) { box.innerHTML = ''; return; }

    var steps = (d.steps || []).map(function (s, i) {
      return '<div class="log-item">' +
        '<div class="log-head">' +
          '<span class="node-idx">' + (i + 1) + '</span>' +
          '<b>' + esc(s.node_name) + '</b>' +
          '<span class="type-tag">' + esc(s.node_type) + '</span>' +
          '<div class="spacer"></div>' +
          '<span class="status ' + esc(s.status) + '">' + esc(s.status) + '</span>' +
          '<span class="hint" style="margin:0;">' + esc(s.duration_ms) + ' ms</span>' +
        '</div>' +
        (s.input ? '<pre>输入：' + esc(pretty(s.input)) + '</pre>' : '') +
        (s.output ? '<pre>输出：' + esc(pretty(s.output)) + '</pre>' : '') +
        (s.error ? '<pre style="color:var(--danger)">错误：' + esc(s.error) + '</pre>' : '') +
      '</div>';
    }).join('');

    box.innerHTML =
      '<div class="card">' +
        '<div class="card-title">运行详情 #' + d.id +
          (isActiveRun(d.status) ? '<span class="hint" style="margin:0;color:var(--warn);">执行中，每 2 秒自动刷新…</span>' : '') +
          '<div class="spacer"></div>' +
          '<button class="btn small" data-act="closeDetail">收起</button>' +
        '</div>' +
        '<div class="kv" style="margin-bottom:12px;">' +
          '<span>状态 <b><span class="status ' + esc(d.status) + '">' + esc(d.status) + '</span></b></span>' +
          '<span>触发方式 <b>' + esc(d.trigger) + '</b></span>' +
          '<span>耗时 <b>' + esc(d.duration_ms) + ' ms</b></span>' +
          '<span>开始 <b class="mono">' + esc(d.started_at) + '</b></span>' +
        '</div>' +
        (d.payload ? '<div class="field"><label>触发负载</label><pre>' + esc(pretty(d.payload)) + '</pre></div>' : '') +
        steps +
      '</div>';
  }

  function renderTopbar() {
    $('#jobCount').textContent = state.schedulerJobs;
    $('#typeList').textContent = state.nodeTypes.join(' / ');
  }

  // ---------- 轮询 ----------
  function hasActiveRun() {
    var listActive = state.runs.some(function (r) { return isActiveRun(r.status); });
    return listActive || !!(state.detail && isActiveRun(state.detail.status));
  }

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(pollTick, POLL_INTERVAL);
    var tag = $('#pollingTag');
    if (tag) tag.style.display = '';
  }

  function stopPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = null;
    var tag = $('#pollingTag');
    if (tag) tag.style.display = 'none';
  }

  function syncPolling() {
    if (hasActiveRun()) startPolling(); else stopPolling();
  }

  function pollTick() {
    loadRuns(true).then(function () {
      if (state.detail) return loadDetail(state.detail.id, true);
    }).then(function () {
      if (!hasActiveRun()) stopPolling();
    });
  }

  function watchTick() {
    if (pollTimer || !state.current || !state.current.id) return;
    loadRuns(true).then(function (appeared) {
      if (appeared) showToast('检测到新的运行记录');
    });
  }

  // ---------- 业务 ----------
  function loadWorkflows() {
    return api('/api/workflows').then(function (list) {
      state.workflows = list || [];
      renderSidebar();
    });
  }

  function selectWorkflow(wf) {
    return api('/api/workflows/' + wf.id).then(function (full) {
      stopPolling();
      lastRunID = 0;
      state.current = full;
      state.detail = null;
      state.runFilter = full.id;
      parseGraph();
      renderSidebar();
      renderContent();
      return loadRuns();
    });
  }

  function createWorkflow() {
    stopPolling();
    lastRunID = 0;
    state.current = {
      id: 0, name: '新工作流', description: '', enabled: true,
      cron: '', group: '', webhook_key: '', graph: ''
    };
    state.nodes = [];
    state.detail = null;
    state.runFilter = 0;
    state.runs = [];
    renderSidebar();
    renderContent();
  }

  function parseGraph() {
    var graph = { nodes: [], edges: [] };
    try { graph = JSON.parse(state.current.graph || '{}'); } catch (e) { /* 空图 */ }
    var src = graph.nodes || [];
    var edges = graph.edges || [];
    nodeSeq = src.length;

    state.nodes = src.map(function (n) {
      var deps = edges.filter(function (e) { return e.target === n.id; })
                      .map(function (e) { return e.source; });
      var headers = (n.config && n.config.headers) || {};
      return {
        id: n.id,
        type: n.type,
        name: n.name || n.type,
        dependsOn: deps,
        headersText: Object.keys(headers).length ? JSON.stringify(headers, null, 2) : '',
        config: Object.assign(defaultsFor(n.type), n.config || {})
      };
    });
  }

  function buildGraph() {
    var ns = state.nodes.map(function (n) {
      var cfg = Object.assign({}, n.config);
      if (n.type === 'http') {
        var headers = {};
        if (n.headersText && n.headersText.trim()) {
          try { headers = JSON.parse(n.headersText); }
          catch (e) { throw new Error('节点「' + (n.name || n.id) + '」的请求头不是合法 JSON'); }
        }
        cfg.headers = headers;
      }
      return { id: n.id, type: n.type, name: n.name || n.type, config: cfg };
    });

    var edges = [];
    state.nodes.forEach(function (n) {
      (n.dependsOn || []).forEach(function (src) {
        edges.push({ source: src, target: n.id });
      });
    });

    state.current.graph = JSON.stringify({ nodes: ns, edges: edges });
  }

  function save() {
    if (!state.current) return;
    busy.saving = true;
    var btn = document.querySelector('[data-act="save"]');
    if (btn) btn.disabled = true;

    var go = function () {
      try { buildGraph(); }
      catch (e) { showToast(e.message, 'error'); return finish(); }

      var c = state.current;
      var body = JSON.stringify({
        name: c.name,
        description: c.description,
        enabled: c.enabled,
        cron: c.cron,
        group: c.group || '',
        webhook_key: c.webhook_key,
        graph: c.graph
      });

      var req = c.id
        ? api('/api/workflows/' + c.id, { method: 'PUT', body: body })
        : api('/api/workflows', { method: 'POST', body: body });

      return req.then(function (saved) {
        showToast('保存成功');
        return loadWorkflows().then(function () { return selectWorkflow(saved); });
      }).catch(function (e) {
        showToast(e.message, 'error');
      }).then(finish);
    };

    function finish() {
      busy.saving = false;
      var b = document.querySelector('[data-act="save"]');
      if (b) b.disabled = false;
    }

    return go();
  }

  function remove() {
    if (!state.current) return;
    if (!state.current.id) { createWorkflow(); return; }
    if (!confirm('确认删除工作流「' + state.current.name + '」？')) return;
    api('/api/workflows/' + state.current.id, { method: 'DELETE' }).then(function () {
      state.current = null;
      state.nodes = [];
      state.runs = [];
      state.detail = null;
      stopPolling();
      return loadWorkflows();
    }).then(function () {
      renderContent();
      showToast('已删除');
    }).catch(function (e) { showToast(e.message, 'error'); });
  }

  function addNode() {
    nodeSeq++;
    var id = 'n' + nodeSeq;
    state.nodes.push({
      id: id, type: 'http', name: '节点 ' + nodeSeq,
      dependsOn: [], headersText: '', config: defaultsFor('http')
    });
    renderNodes();
  }

  function setFilter(id) {
    state.runFilter = id;
    lastRunID = 0;
    renderTabs();
    loadRuns();
  }

  // loadRuns 拉取运行记录列表，silent 为真时不显示加载态与错误提示（轮询用）。
  // 返回值表示本次是否出现了比上次更新的运行记录。
  function loadRuns(silent) {
    if (!silent) busy.loadingRuns = true;
    var id = state.runFilter || (state.current && state.current.id);
    return api('/api/runs?workflow_id=' + (id || '') + '&limit=30').then(function (list) {
      state.runs = list || [];
      var maxID = state.runs.reduce(function (m, r) { return r.id > m ? r.id : m; }, 0);
      var appeared = lastRunID > 0 && maxID > lastRunID;
      lastRunID = maxID;
      renderRuns();
      syncPolling();
      return appeared;
    }).catch(function (e) {
      if (!silent) showToast(e.message, 'error');
      return false;
    }).then(function (v) {
      if (!silent) busy.loadingRuns = false;
      return v;
    });
  }

  function loadDetail(id, silent) {
    return api('/api/runs/' + id).then(function (d) {
      state.detail = d;
      renderDetail();
      syncPolling();
    }).catch(function (e) {
      if (!silent) showToast(e.message, 'error');
    });
  }

  function runNow() {
    if (!state.current || !state.current.id) { showToast('请先保存工作流', 'error'); return; }
    busy.running = true;
    api('/api/workflows/' + state.current.id + '/run', {
      method: 'POST', body: JSON.stringify({ source: 'web-ui' })
    }).then(function (run) {
      showToast('已触发运行 #' + run.id + '，进度自动刷新');
      state.runFilter = state.current.id;
      renderTabs();
      // 先用触发返回的记录占位，详情卡片立即可见，再由轮询补全节点日志。
      state.detail = Object.assign({ steps: [] }, run);
      renderDetail();
      return loadRuns(true).then(function () { return loadDetail(run.id, true); });
    }).then(function () {
      syncPolling();
    }).catch(function (e) {
      showToast(e.message, 'error');
    }).then(function () { busy.running = false; });
  }

  function testWebhook() {
    if (!state.current || !state.current.id) { showToast('请先保存工作流', 'error'); return; }
    fetch('/hook/' + encodeURIComponent(state.current.webhook_key), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source: 'webhook-test', at: new Date().toISOString() })
    }).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || '触发失败');
        showToast('Webhook 已触发，运行 #' + data.run_id);
        state.runFilter = state.current.id;
        renderTabs();
        return loadRuns(true).then(function () { return loadDetail(data.run_id, true); });
      });
    }).then(function () {
      syncPolling();
    }).catch(function (e) { showToast(e.message, 'error'); });
  }

  function copyWebhook() {
    var el = $('#webhookURL');
    var text = el ? el.value : '';
    if (!text) { showToast('请先保存工作流', 'error'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { showToast('已复制到剪贴板'); },
        function () { showToast('复制失败，请手动复制', 'error'); }
      );
    } else {
      el.select();
      showToast('请按 Ctrl+C 复制');
    }
  }

  function refreshStatus() {
    api('/status').then(function (s) {
      showToast('CPU ' + s.cpu.usage.toFixed(1) + '% · 内存 ' + s.memory.usage.toFixed(1) + '% · 运行 ' + s.uptime + 's');
    }).catch(function (e) { showToast(e.message, 'error'); });
  }

  function loadMeta() {
    api('/api/node-types').then(function (t) {
      state.nodeTypes = t; renderTopbar();
      renderNodes();
    }).catch(function () { /* 元数据加载失败不影响主流程 */ });

    api('/api/agent-tools').then(function (t) {
      state.agentTools = t; renderNodes();
    }).catch(function () { /* 保留默认工具清单 */ });

    api('/health').then(function (h) {
      state.schedulerJobs = (h.data && h.data.scheduler_jobs) || 0;
      renderTopbar();
    }).catch(function () { /* 健康检查失败不提示 */ });
  }

  // ---------- 事件绑定 ----------
  // 工作流基本信息字段：输入即写回 state，不重渲染，避免输入框失焦。
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;

    var wfKey = el.getAttribute('data-wf');
    if (wfKey && state.current) {
      state.current[wfKey] = readValue(el);
      return;
    }

    var bind = el.getAttribute('data-bind');
    if (bind) {
      var wrap = el.closest('.node');
      if (!wrap) return;
      var n = state.nodes[Number(wrap.getAttribute('data-idx'))];
      if (!n) return;
      setPath(n, bind, readValue(el));
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;

    var wfKey = el.getAttribute('data-wf');
    if (wfKey && state.current) {
      state.current[wfKey] = readValue(el);
      return;
    }

    var bind = el.getAttribute('data-bind');
    if (!bind) return;
    var wrap = el.closest('.node');
    if (!wrap) return;
    var idx = Number(wrap.getAttribute('data-idx'));
    var n = state.nodes[idx];
    if (!n) return;

    // 切换节点类型时重建默认配置并整体重绘节点区。
    if (bind === 'type') {
      n.config = defaultsFor(el.value);
      renderNodes();
      return;
    }
    setPath(n, bind, readValue(el));
  });

  // 统一处理所有按钮点击。
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var idx = Number(el.getAttribute('data-idx'));
    var id = el.getAttribute('data-id');

    switch (act) {
      case 'selectWorkflow':
        loadWorkflows().then(function () {});
        api('/api/workflows/' + id).then(function (full) {
          stopPolling();
          lastRunID = 0;
          state.current = full;
          state.detail = null;
          state.runFilter = full.id;
          parseGraph();
          renderSidebar();
          renderContent();
          return loadRuns();
        }).catch(function (err) { showToast(err.message, 'error'); });
        break;

      case 'createWorkflow': createWorkflow(); break;
      case 'save': save(); break;
      case 'remove': remove(); break;
      case 'runNow': runNow(); break;
      case 'testWebhook': testWebhook(); break;
      case 'copyWebhook': copyWebhook(); break;
      case 'refreshStatus': refreshStatus(); break;

      case 'addNode': addNode(); break;
      case 'removeNode':
        var removed = state.nodes[idx].id;
        state.nodes.splice(idx, 1);
        state.nodes.forEach(function (n) {
          n.dependsOn = (n.dependsOn || []).filter(function (d) { return d !== removed; });
        });
        renderNodes();
        break;
      case 'moveUp':
        if (idx > 0) state.nodes.splice(idx - 1, 0, state.nodes.splice(idx, 1)[0]);
        renderNodes();
        break;
      case 'moveDown':
        if (idx < state.nodes.length - 1) state.nodes.splice(idx + 1, 0, state.nodes.splice(idx, 1)[0]);
        renderNodes();
        break;

      case 'refreshRuns': loadRuns(); break;
      case 'setFilter': setFilter(Number(id)); break;
      case 'loadDetail': loadDetail(Number(id)); break;
      case 'closeDetail':
        state.detail = null;
        renderDetail();
        syncPolling();
        break;
    }
  });

  // ---------- 启动 ----------
  renderTopbar();
  renderSidebar();
  renderContent();

  loadMeta().then(loadWorkflows).then(function () {
    if (state.workflows.length) return selectWorkflow(state.workflows[0]);
  }).catch(function () { /* 启动失败保持空态 */ });

  // 定时感知定时任务 / Webhook 等外部触发产生的新运行记录。
  watchTimer = setInterval(watchTick, WATCH_INTERVAL);
})();
</script>
</body>
</html>
