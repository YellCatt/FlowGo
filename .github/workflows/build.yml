name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: mipsle
            goflags: GOMIPS=softfloat
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Download dependencies
      run: go mod tidy

    - name: Build for ${{ matrix.target.os }}/${{ matrix.target.arch }}
      env:
        CGO_ENABLED: 0
        GOOS: ${{ matrix.target.os }}
        GOARCH: ${{ matrix.target.arch }}
      run: |
        OUTPUT_FILE="flowgo_${{ matrix.target.os }}_${{ matrix.target.arch }}${{ matrix.target.os == 'windows' && '.exe' || '' }}"
        ${{ matrix.target.goflags }} go build -trimpath -ldflags="-s -w" -o "$OUTPUT_FILE"
        ls -la flowgo_*

    - name: Package release
      run: |
        mkdir -p release
        mv flowgo_* release/
        tar -czf flowgo_${{ matrix.target.os }}_${{ matrix.target.arch }}.tar.gz release/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: flowgo_${{ matrix.target.os }}_${{ matrix.target.arch }}
        path: flowgo_${{ matrix.target.os }}_${{ matrix.target.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Create or Update Dev Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="dev-latest"
          echo "使用固定版本tag: $VERSION"

          gh release delete "$VERSION" --yes 2>/dev/null || true

          gh release create "$VERSION" \
            --title "Development Build (Latest)" \
            --notes "Automatic build from commit ${{ github.sha }}%0A%0A**构建方式:** 纯 Go，CGO_ENABLED=0，单文件分发%0A%0A**平台:** Linux amd64/arm64/mipsle、macOS amd64/arm64、Windows amd64%0A%0A**使用说明:** 解压后运行对应平台的可执行文件，浏览器打开 http://localhost:8084" \
            --prerelease \
            artifacts/*