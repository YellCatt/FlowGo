name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            arch: amd64
            suffix: linux_amd64
            runner: ubuntu-latest
            goflags: GOOS=linux GOARCH=amd64 CGO_ENABLED=1
            ldflags: "-s -w"

          - os: linux
            arch: arm64
            suffix: linux_arm64
            runner: ubuntu-latest
            goflags: GOOS=linux GOARCH=arm64 CGO_ENABLED=1
            ldflags: "-s -w"

          - os: linux
            arch: mipsle
            suffix: linux_mipsle
            runner: ubuntu-latest
            goflags: GOOS=linux GOARCH=mipsle GOMIPS=softfloat CGO_ENABLED=1
            ldflags: "-s -w -linkmode=external -extldflags '-static'"
            toolchain_url: https://downloads.openwrt.org/releases/23.05.0/targets/ramips/mt7620/openwrt-sdk-23.05.0-ramips-mt7620_gcc-12.3.0_musl.Linux-x86_64.tar.xz

          - os: darwin
            arch: amd64
            suffix: darwin_amd64
            runner: macos-latest
            goflags: GOOS=darwin GOARCH=amd64 CGO_ENABLED=1
            ldflags: "-s -w"

          - os: darwin
            arch: arm64
            suffix: darwin_arm64
            runner: macos-latest
            goflags: GOOS=darwin GOARCH=arm64 CGO_ENABLED=1
            ldflags: "-s -w"

          - os: windows
            arch: amd64
            suffix: windows_amd64
            runner: ubuntu-latest
            goflags: GOOS=windows GOARCH=amd64 CGO_ENABLED=1
            ldflags: "-s -w"

    runs-on: ${{ matrix.target.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install OpenWrt musl toolchain for MIPSle
      if: matrix.target.arch == 'mipsle'
      run: |
        sudo apt-get update
        sudo apt-get install -y xz-utils
        wget -q "${{ matrix.target.toolchain_url }}"
        tar -xJf openwrt-sdk-*.tar.xz
        SDK_DIR=$(realpath $(ls -d openwrt-sdk-* | head -1))
        TOOLCHAIN_BIN=$(find "$SDK_DIR/staging_dir" -name 'mipsel-openwrt-linux-musl-gcc' -printf '%h\n' | head -1)
        TOOLCHAIN_BIN=$(realpath "$TOOLCHAIN_BIN")
        echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> $GITHUB_ENV
        echo "$TOOLCHAIN_BIN" >> $GITHUB_PATH
        echo "CC=$TOOLCHAIN_BIN/mipsel-openwrt-linux-musl-gcc" >> $GITHUB_ENV
        echo "CXX=$TOOLCHAIN_BIN/mipsel-openwrt-linux-musl-g++" >> $GITHUB_ENV
        "$TOOLCHAIN_BIN/mipsel-openwrt-linux-musl-gcc" --version

    - name: Install MinGW-w64 for Windows
      if: matrix.target.os == 'windows'
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64
        echo "CC=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
        echo "CXX=x86_64-w64-mingw32-g++" >> $GITHUB_ENV

    - name: Install aarch64 cross toolchain for Linux/arm64
      if: matrix.target.os == 'linux' && matrix.target.arch == 'arm64'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

    - name: Set CC for Linux/amd64 native
      if: matrix.target.os == 'linux' && matrix.target.arch == 'amd64' && runner.os == 'Linux'
      run: |
        echo "CC=gcc" >> $GITHUB_ENV

    - name: Download dependencies
      run: |
        go clean -modcache
        go mod tidy

    - name: Build for ${{ matrix.target.os }}/${{ matrix.target.arch }}
      run: |
        OUTPUT_FILE="flowgo_${{ matrix.target.suffix }}${{ matrix.target.os == 'windows' && '.exe' || '' }}"
        BUILD_VERSION="dev-${{ github.run_number }}-$(date +%Y%m%d%H%M%S)"
        BUILD_COMMIT="$(git rev-parse --short HEAD)"
        BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        LDFLAGS_FULL="${{ matrix.target.ldflags }} -X main.version=${BUILD_VERSION} -X main.commit=${BUILD_COMMIT} -X main.buildTime=${BUILD_TIME}"
        ${{ matrix.target.goflags }} go build -tags netgo -trimpath -ldflags="$LDFLAGS_FULL" -o "$OUTPUT_FILE"
        ls -la flowgo_*
        file "$OUTPUT_FILE" || true

    - name: Package release
      run: |
        mkdir -p release
        if [ "${{ matrix.target.os }}" = "windows" ]; then
          mv "flowgo_${{ matrix.target.suffix }}.exe" release/
        else
          mv "flowgo_${{ matrix.target.suffix }}" release/
        fi
        ls -la release/
        tar -czf "flowgo_${{ matrix.target.suffix }}.tar.gz" release/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: flowgo_${{ matrix.target.suffix }}
        path: flowgo_${{ matrix.target.suffix }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Create or Update Dev Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="dev-latest"
          echo "使用固定版本tag: $VERSION"

          gh release delete "$VERSION" --yes 2>/dev/null || true

          gh release create "$VERSION" \
            --title "Development Build (Latest)" \
            --notes "Automatic build from commit ${{ github.sha }}%0A%0A**数据库驱动:** github.com/mattn/go-sqlite3 (CGO)%0A%0A**平台:**%0A- Linux amd64 / arm64 / mipsle (OpenWrt/musl, mipsle 静态链接)%0A- macOS amd64 / arm64%0A- Windows amd64%0A%0A**使用说明:**%0A解压后运行对应平台的可执行文件，浏览器打开 http://localhost:9001" \
            --prerelease \
            artifacts/*